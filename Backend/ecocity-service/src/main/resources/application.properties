spring.application.name=ecocity-service
server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecocity_db}
spring.datasource.username=${DB_USERNAME:ecocity_user}
spring.datasource.password=${DB_PASSWORD:ecocity_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
