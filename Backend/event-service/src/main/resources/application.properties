spring.application.name=event-service
server.port=8084

# ---- Database: this microservice has its OWN database (events_db) ----
# Dedicated database user for this service (created by database/init.sql).
# Can be overridden with the environment variables DB_USERNAME / DB_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:events_db}
spring.datasource.username=${DB_USERNAME:events_user}
spring.datasource.password=${DB_PASSWORD:events_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# "update" creates and updates the tables automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
