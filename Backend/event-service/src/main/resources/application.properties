spring.application.name=event-service
server.port=8084

# ---- Database: this microservice has its OWN database (events_db) ----
# Put your own password in the IntelliJ run configuration as an environment variable: DB_PASSWORD=yourPassword
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:events_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# "update" creates and updates the tables automatically from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
